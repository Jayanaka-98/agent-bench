# The jac-paper protocol on the toy task: any builder, reviewed by a Claude
# Code driver, then accepted; failures go back to the builder.
run_id = "reviewed"
runs_dir = "../../runs"
tasks = ["../tasks/wordfreq"]
arms = ["../arms/stdlib.toml"]
protocol = "reviewed"
max_rounds = 3
lanes = 2
port_base = 8670

[budget]
tokens = 3e6              # builder + driver, stopped mid-turn when reached
counts = ["builder", "driver"]

[driver]
model = "claude-opus-5-5"
endpoint = "anthropic"    # metered too, under its own role
options = { auth = "subscription" }

[proxy]
port = 8791
[proxy.upstreams.anthropic]
url = "https://api.anthropic.com"
api = "anthropic"

[[builders]]
name = "cc-opus"
agent = "claude-code"
model = "claude-opus-5-5"
endpoint = "anthropic"
options = { auth = "subscription" }

[[builders]]
name = "oc-opus"
agent = "opencode"
model = "claude-opus-5-5"
endpoint = "anthropic"
