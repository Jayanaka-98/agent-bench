# The test suite on every push, on the jac toolchain the project pins
# (jac.toml: jac-version). It needs no model access and no secrets: the proxy
# is tested against a fake model API, and builds run scripted agents.
name: tests

on:
  push:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  JAC_VERSION: "0.37.25"

jobs:
  test:
    name: jac ${{ matrix.asset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset: linux-x86_64
          - os: macos-latest
            asset: macos-aarch64
    steps:
      - uses: actions/checkout@v5
      - name: Install jac (official release binary, checksum-verified)
        run: |
          base="https://github.com/jaseci-labs/jaseci/releases/download/v${JAC_VERSION}"
          f="jac-${JAC_VERSION}-${{ matrix.asset }}"
          curl -fsSL -o "$f" "$base/$f"
          curl -fsSL -o "$f.sha256" "$base/$f.sha256"
          if command -v sha256sum >/dev/null; then sha256sum -c "$f.sha256"; else shasum -a 256 -c "$f.sha256"; fi
          mkdir -p "$HOME/.local/bin"
          install -m 755 "$f" "$HOME/.local/bin/jac"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: jac --version
      - name: Install dependencies
        run: jac install --dev
      - name: Type-check and compile every module
        run: ./scripts/check.sh
      - name: Test
        run: jac x pytest -v
