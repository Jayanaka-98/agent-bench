<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-bench runs</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #fbfaf7; --surface: #ffffff; --ink: #1d2327; --ink-2: #4a545b; --muted: #6f7a82;
  --line: #e4e1da; --accent: #c2410c; --accent-soft: #fdeee4; --blue: #1f5f8b; --blue-soft: #e8f1f8;
  --green: #2f7d4f; --green-soft: #e6f4ec; --red: #b42318; --red-soft: #fdecea; --amber: #a15c07; --amber-soft: #fdf3e2;
  --t-cache: #9fb9cc; --t-input: #1f5f8b; --t-write: #d39a43; --t-output: #c2410c;
  --c1: #1f5f8b; --c2: #c2410c; --c3: #2f7d4f; --c4: #7c3aed; --c5: #a15c07; --c6: #0e7490;
  --code-bg: #f3f1ec;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171a; --surface: #1b1f23; --ink: #e8eaec; --ink-2: #b9c0c6; --muted: #8d969d;
    --line: #2c3238; --accent: #f08a4b; --accent-soft: #3a2518; --blue: #79b4e0; --blue-soft: #1a2a37;
    --green: #6fc796; --green-soft: #183126; --red: #f2837a; --red-soft: #3a1c1a; --amber: #e8b25c; --amber-soft: #352816;
    --t-cache: #4d6a80; --t-input: #79b4e0; --t-write: #e8b25c; --t-output: #f08a4b;
    --c1: #79b4e0; --c2: #f08a4b; --c3: #6fc796; --c4: #b69cf7; --c5: #e8b25c; --c6: #5ec8d8;
    --code-bg: #22272c;
  }
}
:root[data-theme="dark"] {
  --bg: #14171a; --surface: #1b1f23; --ink: #e8eaec; --ink-2: #b9c0c6; --muted: #8d969d;
  --line: #2c3238; --accent: #f08a4b; --accent-soft: #3a2518; --blue: #79b4e0; --blue-soft: #1a2a37;
  --green: #6fc796; --green-soft: #183126; --red: #f2837a; --red-soft: #3a1c1a; --amber: #e8b25c; --amber-soft: #352816;
  --t-cache: #4d6a80; --t-input: #79b4e0; --t-write: #e8b25c; --t-output: #f08a4b;
  --c1: #79b4e0; --c2: #f08a4b; --c3: #6fc796; --c4: #b69cf7; --c5: #e8b25c; --c6: #5ec8d8;
  --code-bg: #22272c;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 Inter, system-ui, -apple-system, sans-serif; }
.mono, code { font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .86em; }
a { color: var(--blue); }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px 48px; }
header.top { display: flex; align-items: center; gap: 12px; padding: 18px 0 10px; border-bottom: 1px solid var(--line); margin-bottom: 18px; flex-wrap: wrap; }
header.top h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
header.top h1 span { color: var(--accent); }
.status { color: var(--muted); font-size: 13px; flex: 1; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); border-radius: 8px; padding: 5px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.btn:hover { color: var(--ink); border-color: var(--muted); }
h2 { font-size: 15px; margin: 26px 0 10px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
.machines { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.machine { padding: 12px 14px; }
.machine .name { font-weight: 600; display: flex; align-items: center; gap: 8px; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--green); flex: none; }
.dot.stale { background: var(--red); }
.dot.idle { background: var(--muted); }
.machine .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
.meter { height: 6px; background: var(--code-bg); border-radius: 4px; overflow: hidden; margin-top: 8px; }
.meter > i { display: block; height: 100%; background: var(--blue); }
.meter > i.hot { background: var(--red); }
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 500; font-size: 12.5px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: none; }
.chip { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
.chip.running { background: var(--blue-soft); color: var(--blue); }
.chip.done, .chip.pass { background: var(--green-soft); color: var(--green); }
.chip.fail, .chip.stopped, .chip.stale { background: var(--red-soft); color: var(--red); }
.chip.queued, .chip.starting { background: var(--code-bg); color: var(--muted); }
.chip.wait { background: var(--amber-soft); color: var(--amber); }
.run { margin-bottom: 14px; }
.run > summary { list-style: none; cursor: pointer; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.run > summary::-webkit-details-marker { display: none; }
.run > summary .rid { font-weight: 600; }
.run > summary .sub { color: var(--muted); font-size: 13px; }
.run > summary .grow { flex: 1; }
.prog { width: 140px; height: 6px; background: var(--code-bg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.prog > i { display: block; height: 100%; background: var(--green); }
.runbody { border-top: 1px solid var(--line); padding: 12px 14px 16px; }
.matrix td.cell { cursor: pointer; }
.matrix td.cell:hover { background: var(--code-bg); }
.cellv { font-variant-numeric: tabular-nums; font-weight: 500; }
.cellm { color: var(--muted); font-size: 12px; }
.mark { font-weight: 700; margin-left: 4px; }
.mark.pass { color: var(--green); } .mark.fail { color: var(--red); }
.sect { font-size: 13px; color: var(--ink-2); font-weight: 600; margin: 18px 0 8px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--ink-2); margin: 4px 0 10px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.bars { display: grid; grid-template-columns: minmax(120px, 230px) 1fr 70px; gap: 6px 10px; align-items: center; font-size: 13px; }
.bars .lab { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.bars .bar { height: 14px; display: flex; border-radius: 3px; overflow: hidden; background: var(--code-bg); }
.bars .bar i { display: block; height: 100%; }
.bars .val { text-align: right; font-variant-numeric: tabular-nums; }
svg.tl { width: 100%; height: 220px; display: block; }
svg.tl text { fill: var(--muted); font: 11px Inter, system-ui, sans-serif; }
svg.tl line.grid { stroke: var(--line); }
.detail { margin-top: 12px; padding: 12px 14px; background: var(--code-bg); border-radius: 10px; font-size: 13px; }
.detail dl { display: grid; grid-template-columns: max-content 1fr; gap: 3px 14px; margin: 6px 0 0; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; overflow-wrap: anywhere; }
.empty { color: var(--muted); padding: 14px; }
.lock { max-width: 560px; margin: 60px auto; padding: 22px; }
.lock h3 { margin: 0 0 8px; }
.err { color: var(--red); font-size: 13px; }
.cmp-ctl { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
.cmp-ctl label { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; background: var(--surface); cursor: pointer; }
.cmp-ctl label.off { opacity: .45; }
.cmp-ctl input { margin: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 13px; padding: 3px 10px; cursor: pointer; }
.seg button.on { background: var(--blue-soft); color: var(--blue); font-weight: 600; }
table.cmp td.best .cellv { color: var(--green); }
table.cmp td.best { background: var(--green-soft); }
table.cmp td.jac { box-shadow: inset 3px 0 0 var(--accent); }
.rel { color: var(--muted); font-size: 12px; }
.note { color: var(--muted); font-size: 12.5px; margin: 8px 2px 0; }
@media (max-width: 640px) {
  .prog { width: 90px; }
  .bars { grid-template-columns: minmax(90px, 130px) 1fr 54px; }
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>agent-bench <span>runs</span></h1>
    <div class="status" id="status">loading…</div>
    <button class="btn" id="refresh" type="button">Refresh</button>
    <button class="btn" id="theme" type="button" aria-label="Toggle theme">Theme</button>
  </header>
  <main id="app"></main>
</div>
<script>
"use strict";
const POLL_MS = 60000, STALE_S = 15 * 60;
const TOKEN_KINDS = [["cache_read", "cache read", "--t-cache"], ["input", "fresh input", "--t-input"],
                     ["cache_write", "cache write", "--t-write"], ["output", "output", "--t-output"]];
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

// ---- theme (per-viewer convenience only) ------------------------------------------
function applyTheme(t) { if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme; }
try { applyTheme(localStorage.getItem("ab-dash-theme")); } catch (e) {}
$("#theme").onclick = () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  const next = cur === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem("ab-dash-theme", next); } catch (e) {}
  render();
};

// ---- formatting ---------------------------------------------------------------------
function fmtTok(n) {
  n = Number(n || 0);
  if (n >= 1e6) return (n / 1e6).toFixed(n >= 1e7 ? 1 : 2) + "M";
  if (n >= 1e3) return Math.round(n / 1e3) + "k";
  return String(n);
}
function fmtDur(s) {
  if (s == null) return "–";
  s = Math.max(0, Math.round(s));
  if (s < 60) return s + "s";
  const m = Math.floor(s / 60);
  if (m < 60) return m + "m " + String(s % 60).padStart(2, "0") + "s";
  return Math.floor(m / 60) + "h " + String(m % 60).padStart(2, "0") + "m";
}
const ago = iso => iso ? fmtDur((Date.now() - Date.parse(iso)) / 1000) + " ago" : "–";
const fmtTime = iso => iso ? new Date(iso).toLocaleString([], {month: "short", day: "numeric", hour: "2-digit", minute: "2-digit"}) : "–";

// ---- key, fetch, decrypt ------------------------------------------------------------
const params = new URLSearchParams(location.hash.slice(1));
const KEY_B64 = params.get("k"), REPO = params.get("r");
const b64ToBytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64uToBytes = s => b64ToBytes(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));
let cryptoKey = null, etag = null, sha = null, lastSha = null, lastFetch = 0, rateLimited = false;
const fileCache = new Map();   // file -> {sha, data|error}
const state = {machines: [], rejected: 0, error: null, selected: null, open: new Set(), touched: false,
               metric: "tokens", hidden: new Set()};
try { state.hidden = new Set(JSON.parse(localStorage.getItem("ab-dash-hidden") || "[]")); } catch (e) {}

async function headSha() {
  const h = {"Accept": "application/vnd.github.sha"};
  if (etag) h["If-None-Match"] = etag;
  try {
    const r = await fetch(`https://api.github.com/repos/${REPO}/commits/main`, {headers: h, cache: "no-store"});
    if (r.status === 304) { rateLimited = false; return sha; }
    if (r.ok) { etag = r.headers.get("ETag"); sha = (await r.text()).trim(); rateLimited = false; return sha; }
    rateLimited = r.status === 403 || r.status === 429;
  } catch (e) { /* network: fall through */ }
  return "main";   // the raw CDN's copy of main: up to ~5 min old
}
async function openSealed(fid, text) {
  const blob = b64ToBytes(text.trim());
  const pt = await crypto.subtle.decrypt(
    {name: "AES-GCM", iv: blob.slice(0, 12), additionalData: new TextEncoder().encode("agent-bench-dash/v1/" + fid)},
    cryptoKey, blob.slice(12));
  const stream = new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(stream).text());
}
async function load() {
  if (!cryptoKey) cryptoKey = await crypto.subtle.importKey("raw", b64uToBytes(KEY_B64), "AES-GCM", false, ["decrypt"]);
  const ref = await headSha();
  if (ref !== "main" && ref === lastSha) { lastFetch = Date.now(); return; }
  const base = `https://raw.githubusercontent.com/${REPO}/${ref}`;
  const bust = ref === "main" ? `?t=${Date.now()}` : "";
  const idx = await (await fetch(`${base}/index.json${bust}`, {cache: "no-store"})).json();
  const machines = []; let rejected = 0;
  await Promise.all((idx.files || []).map(async f => {
    try {
      const text = await (await fetch(`${base}/machines/${f}${bust}`, {cache: "no-store"})).text();
      const d = await openSealed(f.replace(/\.enc$/, ""), text);
      if (d && d.v === 1 && d.machine) machines.push(d); else rejected++;
    } catch (e) { rejected++; }
  }));
  machines.sort((a, b) => a.machine.localeCompare(b.machine));
  state.machines = machines; state.rejected = rejected; state.error = null;
  lastSha = ref; lastFetch = Date.now();
}

// ---- views --------------------------------------------------------------------------
function machineCard(m) {
  const age = (Date.now() - Date.parse(m.at)) / 1000;
  const running = (m.runs || []).filter(r => r.state === "running").length;
  const stale = age > STALE_S;
  const h = m.host || {};
  const memUsed = h.mem_total_gb ? 1 - (h.mem_avail_gb / h.mem_total_gb) : null;
  const load1 = h.load ? h.load[0] : null;
  return `<div class="card machine">
    <div class="name"><span class="dot ${stale ? "stale" : running ? "" : "idle"}"></span>${esc(m.machine)}
      ${stale ? '<span class="chip stale">stale</span>' : ""}</div>
    <div class="meta">seen ${ago(m.at)} · ${running} run${running === 1 ? "" : "s"} active</div>
    <div class="meta">load ${load1 ?? "–"} / ${h.cpus ?? "?"} cpu · disk ${h.disk_free_gb ?? "–"} GB free</div>
    ${memUsed != null ? `<div class="meta">memory ${h.mem_avail_gb} of ${h.mem_total_gb} GB free</div>
      <div class="meter"><i class="${memUsed > .9 ? "hot" : ""}" style="width:${(memUsed * 100).toFixed(0)}%"></i></div>` : ""}
  </div>`;
}

function allRuns() {
  const out = [];
  for (const m of state.machines) for (const r of m.runs || []) out.push({...r, machine: m.machine, machineAt: m.at});
  return out.sort((a, b) => String(b.started).localeCompare(String(a.started)));
}

function runningTable(runs) {
  const rows = [];
  for (const r of runs) for (const b of r.builds || [])
    if (b.state === "running" || b.state === "starting") rows.push({r, b});
  if (!rows.length) return `<div class="card empty">Nothing is building right now.</div>`;
  return `<div class="card tablewrap"><table><thead><tr>
      <th>machine</th><th>run</th><th>task</th><th>arm</th><th>builder</th><th>phase</th>
      <th class="num">in phase</th><th class="num">tokens</th><th class="num">calls</th><th class="num">elapsed</th></tr></thead><tbody>
    ${rows.map(({r, b}) => {
      const inPhase = b.phase_since ? (Date.parse(r.machineAt) / 1000 - b.phase_since) : null;
      const waiting = /accept|limit|wait/i.test(b.phase || "");
      return `<tr><td>${esc(r.machine)}</td><td class="mono">${esc(r.run_id)}</td><td>${esc(b.task)}</td><td>${esc(b.arm)}</td>
        <td>${esc(b.builder)}</td><td><span class="chip ${waiting ? "wait" : "running"}">${esc(b.phase || b.state)}</span></td>
        <td class="num">${fmtDur(inPhase)}</td><td class="num">${fmtTok(b.tokens?.total)}</td><td class="num">${b.calls ?? "–"}</td>
        <td class="num">${fmtDur(b.wall_s)}</td></tr>`;
    }).join("")}</tbody></table></div>`;
}

function armColor(i) { return css(`--c${(i % 6) + 1}`); }

function matrix(r) {
  const tasks = [...new Set(r.builds.map(b => b.task))];
  const cols = [...new Set(r.builds.map(b => b.arm + (r.builds.some(x => x.builder !== b.builder) ? " · " + b.builder : "")))];
  const colOf = b => b.arm + (r.builds.some(x => x.builder !== b.builder) ? " · " + b.builder : "");
  const cell = (t, c) => r.builds.filter(b => b.task === t && colOf(b) === c);
  const tot = c => {
    const done = r.builds.filter(b => colOf(b) === c && b.state === "done");
    return {n: done.length, tok: done.reduce((s, b) => s + (b.tokens?.total || 0), 0),
            pass: done.filter(b => b.accepted === true).length, judged: done.filter(b => b.accepted != null).length};
  };
  return `<div class="tablewrap"><table class="matrix"><thead><tr><th>task</th>
      ${cols.map((c, i) => `<th class="num"><span style="color:${armColor(i)}">●</span> ${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${tasks.map(t => `<tr><td>${esc(t)}</td>${cols.map(c => {
      const bs = cell(t, c);
      if (!bs.length) return `<td class="num">–</td>`;
      return `<td class="num cell" data-run="${esc(r.machine + "/" + r.run_id)}" data-build="${esc(bs[0].build)}">${bs.map(b => {
        const mark = b.accepted === true ? '<span class="mark pass">✓</span>' : b.accepted === false ? '<span class="mark fail">✗</span>' : "";
        if (b.state === "queued") return `<span class="chip queued">queued</span>`;
        if (b.state !== "done") return `<span class="cellv">${fmtTok(b.tokens?.total)}</span> <span class="chip running">${esc(b.phase || b.state)}</span>`;
        return `<span class="cellv">${fmtTok(b.tokens?.total)}</span>${mark}<div class="cellm">${b.calls ?? "–"} calls · ${fmtDur(b.wall_s)}</div>`;
      }).join("")}</td>`;
    }).join("")}</tr>`).join("")}
    <tr><td><b>mean (done)</b></td>${cols.map(c => {
      const s = tot(c);
      return `<td class="num"><b>${s.n ? fmtTok(s.tok / s.n) : "–"}</b><div class="cellm">${s.judged ? `${s.pass}/${s.judged} pass` : ""}</div></td>`;
    }).join("")}</tr></tbody></table></div>`;
}

function breakdown(r) {
  const bs = r.builds.filter(b => b.tokens && b.tokens.total);
  if (!bs.length) return "";
  const max = Math.max(...bs.map(b => b.tokens.total));
  return `<div class="sect">Builder tokens by type</div>
    <div class="legend">${TOKEN_KINDS.map(([, lab, v]) => `<span><i style="background:var(${v})"></i>${lab}</span>`).join("")}</div>
    <div class="bars">${bs.map(b => `
      <div class="lab" title="${esc(b.build)}">${esc(b.task)} · ${esc(b.arm)}</div>
      <div class="bar" title="${TOKEN_KINDS.map(([k, lab]) => `${lab} ${fmtTok(b.tokens[k])}`).join(" · ")}">${
        TOKEN_KINDS.map(([k, , v]) => `<i style="width:${(100 * (b.tokens[k] || 0) / max).toFixed(2)}%;background:var(${v})"></i>`).join("")}</div>
      <div class="val">${fmtTok(b.tokens.total)}</div>`).join("")}</div>`;
}

function timeline(r) {
  const cols = [...new Set(r.builds.map(b => b.arm))];
  const series = r.builds.filter(b => (b.timeline || []).length > 1);
  if (!series.length) return "";
  const W = 900, H = 220, L = 52, R = 12, T = 10, B = 26;
  const maxX = Math.max(...series.map(b => b.timeline[b.timeline.length - 1][0]), 60);
  const maxY = Math.max(...series.map(b => b.timeline[b.timeline.length - 1][1]), 1);
  const x = v => L + (W - L - R) * v / maxX, y = v => H - B - (H - T - B) * v / maxY;
  const ticksY = [0, .25, .5, .75, 1].map(f => f * maxY);
  const stepX = maxX > 7200 ? 1800 : maxX > 1800 ? 600 : maxX > 600 ? 300 : 60;
  const ticksX = []; for (let v = 0; v <= maxX; v += stepX) ticksX.push(v);
  return `<div class="sect">Cumulative builder tokens over each build</div>
    <div class="legend">${cols.map((c, i) => `<span><i style="background:${armColor(i)}"></i>${esc(c)}</span>`).join("")}</div>
    <svg class="tl" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="cumulative tokens per build">
      ${ticksY.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 4}" text-anchor="end">${fmtTok(v)}</text>`).join("")}
      ${ticksX.map(v => `<text x="${x(v)}" y="${H - 8}" text-anchor="middle">${Math.round(v / 60)}m</text>`).join("")}
      ${series.map(b => `<polyline fill="none" stroke="${armColor(cols.indexOf(b.arm))}" stroke-width="1.8" vector-effect="non-scaling-stroke"
          points="${b.timeline.map(p => `${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join(" ")}"><title>${esc(b.task)} · ${esc(b.arm)}: ${fmtTok(b.timeline[b.timeline.length - 1][1])}</title></polyline>`).join("")}
    </svg>`;
}

function detail(r) {
  if (!state.selected || state.selected.run !== r.machine + "/" + r.run_id) return "";
  const b = r.builds.find(x => x.build === state.selected.build);
  if (!b) return "";
  const t = b.tokens || {};
  const rows = [["build", b.build], ["state", b.state + (b.status ? ` (${b.status})` : "")],
    ["accepted", b.accepted == null ? "–" : b.accepted ? "pass" : "fail"],
    ["reasons", (b.reasons || []).join("; ") || "–"],
    ["tokens", `${fmtTok(t.total)} total: ${TOKEN_KINDS.map(([k, lab]) => `${lab} ${fmtTok(t[k])}`).join(", ")}, reasoning ${fmtTok(t.reasoning)}`],
    ["calls", b.calls ?? "–"], ["tool calls", b.tool_calls ?? "–"], ["driver tokens", fmtTok(b.driver_total)],
    ["wall", fmtDur(b.wall_s)], ["lines added", b.lines_added ?? "–"],
    ["started", fmtTime(b.started)], ["finished", fmtTime(b.finished)],
    ["metrics", b.metrics ? Object.entries(b.metrics).map(([k, v]) => `${k} ${v}`).join(", ") : "–"]];
  return `<div class="detail"><b>${esc(b.task)} · ${esc(b.arm)} · ${esc(b.builder)}</b>
    <dl>${rows.map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl></div>`;
}

function runCard(r, i) {
  const n = r.builds.length, done = r.builds.filter(b => b.state === "done").length;
  const stale = r.state === "running" && (Date.now() - Date.parse(r.machineAt)) / 1000 > STALE_S;
  const st = stale ? "stale" : r.state;
  const tok = r.builds.reduce((s, b) => s + (b.tokens?.total || 0), 0);
  const id = r.machine + "/" + r.run_id;
  const open = state.open.has(id) || (!state.touched && i === 0);
  return `<details class="card run" data-id="${esc(id)}" ${open ? "open" : ""}>
    <summary><span class="rid mono">${esc(r.run_id)}</span><span class="chip ${esc(st)}">${esc(st)}</span>
      <span class="sub">${esc(r.machine)} · ${esc(r.experiment)} · started ${fmtTime(r.started)}</span><span class="grow"></span>
      <span class="sub">${done}/${n} done · ${fmtTok(tok)} tokens</span><span class="prog"><i style="width:${n ? (100 * done / n).toFixed(0) : 0}%"></i></span>
    </summary>
    <div class="runbody">${matrix(r)}${detail(r)}${breakdown(r)}${timeline(r)}</div>
  </details>`;
}


// ---- compare: every benchmark x arm, over the chosen runs ---------------------------
const ARM_ORDER = ["openai-sdk", "langgraph", "dspy", "crewai", "nooa"];
function armRank(a) {
  if (a.startsWith("jac")) return "0" + a;
  const i = ARM_ORDER.indexOf(a);
  return (i >= 0 ? "1" + i : "2") + a;
}
const METRICS = {
  tokens: {label: "builder tokens", get: b => b.tokens?.total, fmt: fmtTok},
  calls: {label: "model calls", get: b => b.calls, fmt: v => v == null ? "–" : (v >= 100 ? Math.round(v) : v.toFixed(v % 1 ? 1 : 0))},
  wall: {label: "build time", get: b => b.wall_s, fmt: v => fmtDur(v)}
};
function compare(runs) {
  const shown = runs.filter(r => !state.hidden.has(r.machine + "/" + r.run_id));
  const multiBuilder = new Set(shown.flatMap(r => r.builds.map(b => b.builder))).size > 1;
  const colOf = b => b.arm + (multiBuilder ? " · " + b.builder : "");
  const done = shown.flatMap(r => r.builds.filter(b => b.state === "done").map(b => ({...b, run: r.run_id, machine: r.machine})));
  const ctl = `<div class="cmp-ctl">
      <span class="seg">${Object.entries(METRICS).map(([k, m]) => `<button type="button" data-metric="${k}" class="${state.metric === k ? "on" : ""}">${m.label}</button>`).join("")}</span>
      ${runs.map(r => { const id = r.machine + "/" + r.run_id, off = state.hidden.has(id);
        return `<label class="${off ? "off" : ""}"><input type="checkbox" data-run="${esc(id)}" ${off ? "" : "checked"}>${esc(r.run_id)} <span class="rel">${esc(r.machine)}</span></label>`; }).join("")}
    </div>`;
  if (!done.length) return ctl + `<div class="card empty">No finished builds in the chosen runs yet.</div>`;
  const M = METRICS[state.metric];
  const tasks = [...new Set(done.map(b => b.task))];
  const cols = [...new Set(done.map(colOf))].sort((a, b) => armRank(a).localeCompare(armRank(b)));
  const agg = {};
  for (const b of done) {
    const k = b.task + "|" + colOf(b);
    (agg[k] ||= []).push(b);
  }
  const mean = xs => xs.length ? xs.reduce((s, x) => s + x, 0) / xs.length : null;
  const cellStat = (t, c) => {
    const bs = agg[t + "|" + c] || [];
    const vals = bs.map(M.get).filter(v => v != null);
    return {bs, v: mean(vals), pass: bs.filter(b => b.accepted === true).length, judged: bs.filter(b => b.accepted != null).length};
  };
  const rows = tasks.map(t => {
    const st = cols.map(c => cellStat(t, c));
    const vals = st.map(x => x.v).filter(v => v != null);
    const best = vals.length ? Math.min(...vals) : null;
    return {t, st, best};
  });
  const colMean = cols.map((c, i) => {
    const per = rows.map(r => r.st[i]);
    const complete = per.every(x => x.v != null);
    return {v: complete ? mean(per.map(x => x.v)) : null, n: per.filter(x => x.v != null).length,
            pass: per.reduce((s, x) => s + x.pass, 0), judged: per.reduce((s, x) => s + x.judged, 0),
            rel: complete ? mean(rows.map(r => r.st[i].v / r.best)) : null};
  });
  const bestMean = Math.min(...colMean.map(x => x.v).filter(v => v != null));
  const tip = x => x.bs.map(b => `${b.run} (${b.machine}): ${M.fmt(M.get(b))}${b.accepted === true ? " pass" : b.accepted === false ? " FAIL" : ""}`).join("\n");
  return ctl + `<div class="card tablewrap"><table class="cmp"><thead><tr><th>benchmark</th>
      ${cols.map(c => `<th class="num">${esc(c)}</th>`).join("")}</tr></thead><tbody>
    ${rows.map(r => `<tr><td>${esc(r.t)}</td>${r.st.map((x, i) => {
      if (x.v == null) return `<td class="num${cols[i].startsWith("jac") ? " jac" : ""}">–</td>`;
      const isBest = x.v === r.best;
      const mark = x.judged ? (x.pass === x.judged ? `<span class="mark pass">✓</span>` : `<span class="mark fail">${x.pass}/${x.judged}</span>`) : "";
      return `<td class="num${isBest ? " best" : ""}${cols[i].startsWith("jac") ? " jac" : ""}" title="${esc(tip(x))}">
        <span class="cellv">${M.fmt(x.v)}</span>${mark}<div class="rel">${isBest ? "best" : "×" + (x.v / r.best).toFixed(2) + " best"}${x.bs.length > 1 ? ` · n=${x.bs.length}` : ""}</div></td>`;
    }).join("")}</tr>`).join("")}
    <tr><td><b>mean over benchmarks</b></td>${colMean.map((x, i) => `<td class="num${x.v != null && x.v === bestMean ? " best" : ""}${cols[i].startsWith("jac") ? " jac" : ""}">
        <b class="cellv">${x.v != null ? M.fmt(x.v) : "–"}</b><div class="rel">${x.v != null ? "×" + x.rel.toFixed(2) + " best, avg" : `${x.n}/${tasks.length} benchmarks`}</div>
        <div class="rel">${x.judged ? `${x.pass}/${x.judged} pass` : ""}</div></td>`).join("")}</tr>
    </tbody></table></div>
    <div class="note">Mean over every finished build of that arm in the chosen runs (n shown when more than one). "×best" is the cell divided by the cheapest arm on that benchmark; the bottom row averages it. Hover a cell for each build. Pass/fail is each build's own acceptance check.</div>`;
}
function bindCompare(app) {
  app.querySelectorAll(".seg button[data-metric]").forEach(b => b.addEventListener("click", () => { state.metric = b.dataset.metric; render(); }));
  app.querySelectorAll(".cmp-ctl input[data-run]").forEach(cb => cb.addEventListener("change", () => {
    if (cb.checked) state.hidden.delete(cb.dataset.run); else state.hidden.add(cb.dataset.run);
    try { localStorage.setItem("ab-dash-hidden", JSON.stringify([...state.hidden])); } catch (e) {}
    render();
  }));
}

function render() {
  const app = $("#app");
  if (!KEY_B64 || !REPO) {
    app.innerHTML = `<div class="card lock"><h3>This dashboard is encrypted</h3>
      <p>Open it with the link that <code>agent-bench dash link</code> prints on a machine that joined. The key after <code>#</code>
      stays in your browser: it is never sent to GitHub or any server.</p></div>`;
    $("#status").textContent = "no key in the link";
    return;
  }
  const runs = allRuns();
  const fresh = lastFetch ? `updated ${fmtDur((Date.now() - lastFetch) / 1000)} ago` : "loading…";
  $("#status").innerHTML = `${state.machines.length} machine${state.machines.length === 1 ? "" : "s"} · ${fresh}` +
    (rateLimited ? " · GitHub API limit reached, data may lag ~5 min" : "") +
    (state.rejected ? ` · <span class="err">${state.rejected} file(s) rejected (wrong key or tampered)</span>` : "") +
    (state.error ? ` · <span class="err">${esc(state.error)}</span>` : "");
  if (!state.machines.length) {
    app.innerHTML = lastFetch ? `<div class="card empty">No machine has published yet. On a machine: <code>agent-bench dash join …</code> then <code>agent-bench dash publish</code>.</div>` : "";
    return;
  }
  app.innerHTML = `<h2>Machines</h2><div class="machines">${state.machines.map(machineCard).join("")}</div>
    <h2>Compare frameworks</h2>${compare(runs)}
    <h2>Building now</h2>${runningTable(runs)}
    <h2>Runs</h2>${runs.length ? runs.map(runCard).join("") : '<div class="card empty">No runs since the machines joined.</div>'}`;
  bindCompare(app);
  app.querySelectorAll("details.run").forEach(d => d.addEventListener("toggle", () => {
    if (d.open) state.open.add(d.dataset.id); else state.open.delete(d.dataset.id);
    state.touched = true;
  }));
  app.querySelectorAll("td.cell").forEach(td => td.addEventListener("click", () => {
    const s = {run: td.dataset.run, build: td.dataset.build};
    state.selected = state.selected && state.selected.build === s.build && state.selected.run === s.run ? null : s;
    state.open.add(s.run);
    render();
  }));
}

async function tick() {
  try { await load(); } catch (e) { state.error = "could not load: " + (e.message || e); }
  render();
}
$("#refresh").onclick = () => { lastSha = null; tick(); };
render();
if (KEY_B64 && REPO) { tick(); setInterval(tick, POLL_MS); setInterval(() => { if (lastFetch) render(); }, 15000); }
</script>
</body>
</html>
